<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pokemon Shop</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      width: 220px;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 150px;
      height: auto;
      border-radius: 8px;
    }

    .title {
      font-size: 16px;
      margin: 15px 0 10px;
      font-weight: bold;
    }

    .price {
      color: green;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #ffcb05;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #f2b807;
    }
  </style>
</head>

<body>

  <h1>Pokemon TCG Packs</h1>

  <div class="container">

    <div class="card">
      <img src="https://tcgplayer-cdn.tcgplayer.com/product/672412_in_1000x1000.jpg" alt="Perfect Order Booster Pack">

      <div class="title">
        Pokemon MEGA EVOLUTION TCG Perfect Order Booster Pack
      </div>

      <div class="price">$15</div>

      <button>Buy Now</button>
    </div>

    <div class="card">
      <img src="https://tcgplayer-cdn.tcgplayer.com/product/684448_in_1000x1000.jpg" alt="Chaos Rising Booster Pack">

      <div class="title">
        Pokemon MEGA EVOLUTION TCG Chaos Rising
      </div>

      <div class="price">$15</div>

      <button>Buy Now</button>
    </div>

  </div>

</body>
</html>
